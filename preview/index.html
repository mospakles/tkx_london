<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TKX London — Storefront Preview</title>
  <meta name="description" content="Development preview of the TKX London storefront. Fixture products only; not a live store.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Temporary favicon: approved TKX emblem not yet supplied. Replace with the approved artwork (do not redraw). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Arial' font-weight='900' font-size='11' fill='%23f3eee5'%3ETKX%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=DM+Sans:opsz,wght@9..40,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme/assets/base.css">
  <link rel="stylesheet" href="assets/preview.css">
</head>
<body>
  <a class="skip-link" href="#main" data-skip>Skip to content</a>

  <div class="preview-bar" role="region" aria-label="Preview information">
    <span><strong>PREVIEW — NOT A LIVE STORE.</strong> Development fixtures only: products, prices, stock and imagery are placeholders. No orders, payments or emails are processed.</span>
    <label>Store mode (owner setting)
      <select id="mode-select">
        <option value="prelaunch">Pre-launch: public password page</option>
        <option value="peek">Pre-launch: owner preview of shop</option>
        <option value="live">Full store</option>
      </select>
    </label>
  </div>

  <div id="locale-suggest"></div>
  <div id="announcement"></div>
  <header id="header" class="site-header"></header>
  <main id="main" tabindex="-1"></main>
  <footer id="footer" class="site-footer color-scheme-dark"></footer>
  <div id="layers"></div>
  <div id="live" class="visually-hidden" aria-live="polite"></div>

  <script src="data/catalogue.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
